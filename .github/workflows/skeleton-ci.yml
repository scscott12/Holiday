name: Skeleton CI

on:
  pull_request:
    paths:
      - ".github/workflows/skeleton-ci.yml"
      - "skeleton_project/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/skeleton-ci.yml"
      - "skeleton_project/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skeleton-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Hardware-free validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: skeleton_project

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: skeleton_project/requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install --requirement requirements-ci.txt

      - name: Run hardware-free unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile and import runtime
        run: |
          python -m compileall -q holiday_skeleton scripts tests skeleton_all_in_one_mqtt.py
          python -c "import skeleton_all_in_one_mqtt"

      - name: Validate packaged content and Home Assistant files
        run: python scripts/validate_project.py
